[project]
name = "disclinations"
authors = [
    {name = "Andrés A León Baldelli", email = "leon.baldelli@cnrs.fr"},
    ]
version = "2024.0.1"
requires-python = ">=3.8"

# Short description
description = "We study disclinations in plates, incompressible elasticity, and inverse problems."

# Path to README.md
readme = "README.md"

# Path to license file
license = {file = "LICENSE"}

# Direct dependencies
dependencies = [
    "pandas>=2.2",
    "sympy",
    "matplotlib",
    "gmsh>=4.11.0",
    "PyYAML>=6.0.1",
    "pyvista>=0.43",
    "visuals @ git+https://github.com/kumiori/visuals.git"
]

[project.optional-dependencies]
test = ["pytest"]
dev = [
    "pytest",
    "black",
    "flake8"
]
