[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disclinations"
authors = [{name = "Andrés A León Baldelli", email = "leon.baldelli@cnrs.fr"}]
version = "2024.0.2"
requires-python = ">=3.10"
description = "Audited C0 interior-penalty Foppl-von Karman plate research software"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26,<3", "PyYAML>=6", "mpi4py>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
postprocess = ["matplotlib", "pandas>=2", "scipy", "sympy", "pyvista>=0.43"]
# DOLFINx/PETSc/Gmsh are provisioned together through environment.yml.
# Do not install the unrelated packages named `ufl` or `basix` from the
# historical pipreqs export. Distribution names are fenics-ufl/fenics-basix.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
disclinations = ["models/*.yml", "test/*.yml"]
