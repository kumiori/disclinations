name: disclinations-audit
channels:
  - conda-forge
dependencies:
  - python=3.11
  - fenics-dolfinx=0.9.0
  - fenics-basix=0.9.0
  - fenics-ufl=2024.2.0
  - petsc=3.22.*=real_*
  - petsc4py=3.22
  - mpi4py=4
  - mpich
  - numpy>=1.26,<3
  - scipy
  - pyyaml
  - sympy
  - pytest=8
  - setuptools>=68
  - pip
  # Optional historical plotting/postprocessing:
  - matplotlib
  - pandas
  - pyvista
  - slepc4py=3.22
  - pip:
      - gmsh==4.13.1
